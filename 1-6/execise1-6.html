<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1-6</title>
    <style>
        table{
            margin: 0 auto;
            margin-top: 50px;
        }
        td{
            padding: 10px;
        }
        input[type=button]{
            display: block;
            margin: 0 auto;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>Name</td>
            <td>Surname</td>
            <td>Login</td>
        </tr>
        <tr>
            <td><input type="text" placeholder="Name"></td>
            <td><input type="text" placeholder="Surname"></td>
            <td><input type="text" placeholder="Login"></td>
        </tr>
        <tr>
            <td>Country</td>
            <td>City</td>
            <td>Street</td>
        </tr>
        <tr>
            <td>
                <select>
                    <option>Kazakhstan</option>
                    <option>UK</option>
                    <option>Other</option>
                </select>
            </td>
            <td>
                <select>
                    <option>Almaty</option>
                    <option>Astana</option>
                    <option>Other</option>
                </select>
            </td>
            <td><input type="text" placeholder="Street"></td>
        </tr>
    </table>
    <input type="button" value="Upload data">
</body>
</html>
