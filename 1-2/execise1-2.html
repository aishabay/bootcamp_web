<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exercise 1-2</title>
        <style>
            table{
                border: 2px solid black;
                margin: 0 auto;
                margin-top: 50px;
                padding: 20px;
                border-collapse: collapse;
            }
            td{
                padding: 20px;
                border: 2px solid black;
            }
            input[type=checkbox]{
                display: block;
            }
            input[type=button]{
                display: block;
                margin: 0 auto;
                margin-top: 20px;
                padding: 20px;
                background-color: orange;
                border-radius: 20px;
            }
            input[type=button]:hover{
                background-color: rgb(255, 206, 114);
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td>Тип булочки</td>
                <td>
                    <select>
                        <option selected>Булочка для гамбургера</option>
                        <option>Булочка для сэндвича</option>
                        <option>Лаваш</option>
                        <option>Тортилья</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Тип мяса</td>
                <td>
                    <select>
                        <option selected>Говядина</option>
                        <option>Баранина</option>
                        <option>Курица</option>
                        <option>Без мяса</option>
                    </select>
            </tr>
            <tr>
                <td>Опции</td>
                <td>
                    <input type="checkbox" name="option">Лук
                    <input type="checkbox" name="option">Помидоры
                    <input type="checkbox" name="option">Соленые огурцы
                    <input type="checkbox" name="option">Халапеньо
                    <input type="checkbox" name="option">Айсберг
                </td>
            </tr>
            <tr>
                <td>Адрес</td>
                <td><input type="text" placeholder="Введите адрес"></td>
            </tr>
            <tr>
                <td>ФИО заказчика</td>
                <td><input type="text" placeholder="Введите ФИО"></td>
            </tr>
            <tr>
                <td>Желаемое время доставки</td>
                <td><input type="datetime-local"></td>
            </tr>
            <tr>
                <td>Выбор бургера</td>
                <td>
                    <select>
                        <option>Гамбургер</option>
                        <option selected>Чизбургер</option>
                    </select>
                </td>
            </tr>
        </table>
        <input type="button" value="Заказать">
    </body>
</html>
