<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex4</title>
    <!-- <script src="ex4.js" type="text/javascript"></script> -->
    <style>
        .container{
            margin: 0 auto;
            margin-top: 30px;
            width: 1000px;
        }
        #slider{
            border-radius: 10px;
            /* border: 3px black solid; */
        }
        img{
            margin: 0 auto;
            width: 100%;
            height: 600px;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
        }
        #btns{
            margin-top: 20px;
            display: grid;
            grid-auto-flow: column;
            column-gap: 10px;
        }
        button{
            background-color: black;
            border: none;
            color: white;
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
        }
        button:hover{
            background-color: white;
            border: 3px black solid;
            color: black;
        }
        #btn1{
            justify-self: right;
        }
        #btn2{
            justify-self: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="slider">
            <img id="pic" src="../../images/aang.png" alt="aang">
        </div>
        <div id="btns">
            <button id="btn1">&#8592; Back</button>
            <button id="btn2">Next &#8594;</button>
        </div>
    </div>

    <script>
        let images = ["aang.png", "azula.jpeg", "katara.jpeg", "toph.png", "zuko.jpeg"];
        for(let i=0;i<images.length;i++){
            images[i] = "../../images/" + images[i];
        }
        var count = 0;
        function changePicNext() {
            if(count<images.length-1){
                count++;
                pic.src = images[count];
            }else{
                count = 0;
                pic.src = images[count];
            }
        }
        function changePicPrev(){
            if(count>0){
                count--;
                pic.src = images[count];
            }else{
                count = images.length - 1;
                pic.src = images[count];
            }
        }

        btn1.addEventListener('click', changePicPrev);
        btn2.addEventListener('click', changePicNext);

    </script>
</body>
</html>
