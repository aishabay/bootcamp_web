        function ex2() {
            var n = parseInt(prompt("Enter number n: "));
            let nums = {n};
            for(let i=0;i<n;i++){
                nums[i] = parseInt(prompt());
            }
            var max = Number.MIN_SAFE_INTEGER;
            for(let i=0;i<n;i++){
                if(nums[i]>max){
                    max=nums[i];
                }
            }
            alert(max);
            return max;
        }
        function ex3() {
            var n = parseInt(prompt("Enter number n: "));
            var nums = {n};
            for(let i=0;i<n;i++){
                nums[i] = parseInt(prompt());
            }
            var sum = 0;
            for(let i=0;i<n;i++){
                sum += nums[i];
            }
            var mean = sum / n;
            alert(sum+" "+mean);
            return sum+" "+mean;
        }
        function ex4() {

            }
            let strNums = "";
            for(let i=0;i<n;i++){
                strNums += nums[i] + " ";
            }
            alert(strNums);
            return strNums;
