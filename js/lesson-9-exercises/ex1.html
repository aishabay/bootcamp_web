<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        .container{
            font-size: 20px;
            margin: 0 auto;
            margin-top: 100px;
            width: 600px;
            display: grid;
            grid-template-columns: 200px 300px;
            grid-template-rows: repeat(4, 80px);
        }
        .container > div{
            /* border: 1px solid black; */
        }
        input{
            width: 100%;
            height: 50px;
        }
        button{
            /* margin-top: 20px; */
            width: 170px;
            height: 50px;
            padding: 10px;
            font-size: 17px;
        }
        #register{
            background-color: black;
            border: none;
            color: white;
        }
        #draft{
            background-color: grey;
            border: none;
            color: white;
        }
        select{
            width: 100%;
            height: 50px;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>Name: </div>
        <div><input id="user_name" type="text"></div>
        <div>Surname: </div>
        <div><input id="user_surname" type="text"></div>
        <div>Country: </div>
        <div>
            <select id="user_country">
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="USA">USA</option>
                <option value="France">France</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div>Phone number: </div>
        <div><input id="user_phone" type="text"></div>
        <button id="register">REGISTER</button>
        <button id="draft">SAVE TO DRAFT</button>
    </div>

    <script>
        // let users = [];

        let userJsonFromStorage = localStorage.getItem('user');
        let user = JSON.parse(userJsonFromStorage);
        updateContainer();

        $('#draft').click(function(){
            // let u_name = name.value;
            // let u_surname = surname.value;
            // let u_country = country.value;
            // let u_phone_num = phone.value;

            let user = {
                name: user_name.value,
                surname: user_surname.value,
                country: user_country.value,
                phone: user_phone.value
            }

            // users.push(user);
            let jsonUser = JSON.stringify(user);

            localStorage.setItem('user', jsonUser);
        })

        function updateContainer() {
            if(user != null){
                user_name.value = user.name;
                user_surname.value = user.surname;
                user_country.value = user.country;
                user_phone.value = user.phone;
            }
        }
    </script>
</body>
</html>
