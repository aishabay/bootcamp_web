<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Exercise 1-3</title>
        <style>
            table{
                border: 2px solid black;
                margin: 0 auto;
                margin-top: 50px;
                padding: 20px;
                border-collapse: collapse;
            }
            td{
                padding: 20px;
                border: 2px solid black;
            }
            input[type=checkbox]{
                display: block;
            }
            input[type=button]{
                display: block;
                margin: 0 auto;
                margin-top: 20px;
                padding: 20px;
                background-color: orange;
                border-radius: 20px;
            }
            input[type=button]:hover{
                background-color: rgb(255, 206, 114);
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td>Name:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Surname:</td>
                <td><input type="text"></td>  
            </tr>
            <tr>
                <td>Middle name:</td>
                <td><input type="text"></td>  
            </tr>
            <tr>
                <td>Hometown:</td>
                <td>
                    <select>
                        <option selected>Almaty</option>
                        <option>Astana</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" checked>Male
                    <input type="radio">Female
                </td>
            </tr>
            <tr>
                <td>Date of birth:</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Education:</td>
                <td>
                    <select>
                        <option selected>RPhMS</option>
                        <option>KTL(BIL)</option>
                        <option>NIS</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>ENT score:</td>
                <td><input type="number" placeholder="0"></td>
            </tr>
        </table>
        <input type="button" value="Register">
    </body>
</html>
